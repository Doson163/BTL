services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-baitaplon}
      MARIADB_USER: ${DB_USER:-winmart}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - winmart_db:/var/lib/mysql
      - ./database/01-baitaplon-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/02-initial-payment-method.sql:/docker-entrypoint-initdb.d/02-payment-method.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-baitaplon}
      DB_USER: ${DB_USER:-winmart}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Quản trị viên}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080/Baitaplon}
      WINMART_GOOGLE_CLIENT_ID: ${WINMART_GOOGLE_CLIENT_ID:-}
      WINMART_GOOGLE_CLIENT_SECRET: ${WINMART_GOOGLE_CLIENT_SECRET:-}
      WINMART_GOOGLE_REDIRECT_URI: ${WINMART_GOOGLE_REDIRECT_URI:-http://localhost:8080/Baitaplon/store.php?url=CustomerAuth/GoogleCallback}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - winmart_sessions:/var/lib/php/sessions
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/Baitaplon/User -o /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  winmart_db:
  winmart_sessions:
